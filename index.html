<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideMind AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1020;color:#f5f6ff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{height:65px;background:#151b30;border-bottom:1px solid #29314d;display:flex;align-items:center;padding:0 22px;gap:12px}
.logo{font-size:22px;font-weight:bold;color:#ff754b}
.logo span{color:white}
#status{font-size:12px;color:#aab3ce;margin-left:auto}
main{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:auto;padding:20px;min-height:0}
#messages{flex:1;overflow-y:auto;padding:10px 0}
.welcome{text-align:center;margin:12vh auto 30px;max-width:550px}
.welcome h1{font-size:38px;margin-bottom:10px}
.welcome p{color:#aab3ce;line-height:1.6}
.message{padding:14px 17px;border-radius:15px;margin:12px 0;max-width:85%;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#26365d;margin-left:auto}
.ai{background:#19233b;border:1px solid #303c5c}
#composer{display:flex;gap:10px;background:#171e32;border:1px solid #34405f;border-radius:17px;padding:10px}
textarea{flex:1;resize:none;min-height:48px;max-height:140px;background:transparent;border:0;outline:0;color:white;font:16px Arial;padding:13px}
button{border:0;border-radius:12px;padding:12px 18px;background:#ff7043;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;align-items:center;margin:12px 2px;color:#8f9bb9;font-size:12px}
#progress{height:5px;background:#252e48;border-radius:10px;overflow:hidden;margin:8px 0}
#bar{height:100%;width:0;background:#ff7043;transition:width .2s}
#notice{color:#aab3ce;font-size:12px;text-align:center;line-height:1.5;margin:10px}
@media(max-width:600px){main{padding:12px}.welcome h1{font-size:30px}.message{max-width:95%}header{padding:0 13px}}
</style>
</head>
<body>
<header>
  <div class="logo">🔥 Slide<span>Mind</span></div>
  <div id="status">AI not loaded</div>
</header>

<main>
  <section id="messages">
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Welcome to SlideMind. Your AI runs directly in your browser. The first model download can take a while.</p>
    </div>
  </section>

  <div id="progress"><div id="bar"></div></div>
  <div id="notice">Waiting to load the AI model. A WebGPU-compatible browser is required.</div>

  <div id="composer">
    <textarea id="prompt" placeholder="Message SlideMind..." rows="1"></textarea>
    <button id="send" disabled>Send</button>
  </div>

  <div class="actions">
    <span>SlideMind · Browser AI</span>
    <button id="clear" style="background:#293550;padding:8px 12px">New chat</button>
  </div>
</main>

<script type="module">
const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";

const messagesBox = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const statusBox = document.getElementById("status");
const notice = document.getElementById("notice");
const bar = document.getElementById("bar");

let engine = null;
let busy = false;

let history = [
  {
    role: "system",
    content: "You are SlideMind, a helpful, friendly AI assistant. Give clear, useful answers."
  }
];

function addMessage(text, type) {
  document.getElementById("welcome")?.remove();
  const el = document.createElement("div");
  el.className = "message " + type;
  el.textContent = text;
  messagesBox.appendChild(el);
  messagesBox.scrollTop = messagesBox.scrollHeight;
  return el;
}

async function loadAI() {
  try {
    if (!("gpu" in navigator)) {
      throw new Error("WebGPU is unavailable. Try a compatible, up-to-date browser.");
    }

    statusBox.textContent = "Loading AI library...";
    notice.textContent = "Connecting to the browser AI engine...";

    const webllm = await import("https://esm.run/@mlc-ai/web-llm");

    statusBox.textContent = "Downloading AI model...";
    notice.textContent = "Downloading the AI model. This may take several minutes the first time.";

    engine = await webllm.CreateMLCEngine(MODEL, {
      initProgressCallback: (report) => {
        const percent = Math.round((report.progress || 0) * 100);
        bar.style.width = percent + "%";
        notice.textContent = report.text || "Preparing AI model...";
      }
    });

    statusBox.textContent = "AI ready";
    notice.textContent = "SlideMind is ready. Your messages are processed in this browser.";
    sendButton.disabled = false;
    promptBox.focus();

  } catch (error) {
    console.error(error);
    statusBox.textContent = "AI unavailable";
    notice.textContent = "Could not start the AI: " + error.message;
  }
}

async function sendMessage() {
  const text = promptBox.value.trim();
  if (!text || busy || !engine) return;

  busy = true;
  sendButton.disabled = true;
  promptBox.value = "";

  addMessage(text, "user");
  history.push({ role: "user", content: text });

  const answer = addMessage("Thinking...", "ai");

  try {
    const response = await engine.chat.completions.create({
      messages: history,
      temperature: 0.7,
      max_tokens: 700
    });

    const reply =
      response.choices?.[0]?.message?.content || "I couldn't generate a reply.";

    answer.textContent = reply;
    history.push({ role: "assistant", content: reply });

  } catch (error) {
    answer.textContent = "AI error: " + error.message;
    history.pop();
  }

  busy = false;
  sendButton.disabled = false;
  promptBox.focus();
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

sendButton.addEventListener("click", sendMessage);

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.getElementById("clear").addEventListener("click", () => {
  history = [{
    role: "system",
    content: "You are SlideMind, a helpful, friendly AI assistant. Give clear, useful answers."
  }];
  messagesBox.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Welcome back to SlideMind. What would you like to ask?</p>
    </div>`;
});

loadAI();
</script>
</body>
</html>
