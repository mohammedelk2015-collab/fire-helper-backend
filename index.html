
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SlideMind AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1220;color:white;font-family:Arial,sans-serif;height:100vh;display:flex}
.sidebar{width:250px;background:#151d2d;padding:20px;display:flex;flex-direction:column;gap:18px}
.logo{font-size:27px;font-weight:bold;color:#65aaff}
.new{background:#2879df;padding:13px;border:0;border-radius:10px;color:white;cursor:pointer}
.history{display:flex;flex-direction:column;gap:8px}
.history button{background:#202b3e;color:white;border:0;padding:12px;border-radius:9px;text-align:left;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:20px;border-bottom:1px solid #29354a;font-size:19px;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:18px}
.welcome{margin:auto;text-align:center;color:#aab8ce}
.welcome h1{font-size:40px;color:white}
.message{max-width:800px;padding:15px 18px;border-radius:14px;white-space:pre-wrap;line-height:1.6}
.user{background:#245b9c;align-self:flex-end}
.ai{background:#202b3e;align-self:flex-start}
.bottom{padding:18px;max-width:950px;width:100%;margin:auto}
.composer{display:flex;gap:10px}
textarea{flex:1;background:#192438;color:white;border:1px solid #364967;border-radius:14px;padding:16px;font-size:16px;resize:none;outline:none}
.send{background:#2879df;color:white;border:0;border-radius:12px;padding:15px 22px;cursor:pointer}
#status{text-align:center;color:#9aabc2;font-size:12px;margin-top:10px}
@media(max-width:600px){.sidebar{width:75px;padding:10px}.logo{font-size:14px}.new{font-size:10px;padding:8px}.history{display:none}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<aside class="sidebar">
<div class="logo">✦ SlideMind</div>
<button class="new" onclick="newChat()">＋ New chat</button>
<strong>History</strong>
<div class="history" id="history"></div>
</aside>

<main>
<header>✦ SlideMind AI</header>
<div id="messages">
<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Your personal AI assistant.</p>
</div>
</div>

<div class="bottom">
<div class="composer">
<textarea id="input" rows="1" placeholder="Message SlideMind..."></textarea>
<button class="send" onclick="sendMessage()">➤</button>
</div>
<div id="status">Ready</div>
</div>
</main>

<script>
/*
  GitHub Pages cannot run server.js.
  A public backend URL will be needed for real AI replies.
*/
const API_URL = "YOUR_PUBLIC_BACKEND_URL/api/chat";

let messages=[];
let history=[];

const area=document.getElementById("messages");
const input=document.getElementById("input");
const status=document.getElementById("status");

function addMessage(text,type){
 document.getElementById("welcome")?.remove();
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 area.appendChild(div);
 area.scrollTop=area.scrollHeight;
}

function newChat(){
 messages=[];
 area.innerHTML='<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Your personal AI assistant.</p></div>';
 status.textContent="New chat";
}

function renderHistory(){
 const box=document.getElementById("history");
 box.innerHTML="";
 history.forEach((chat,index)=>{
  const button=document.createElement("button");
  button.textContent=chat.find(m=>m.role==="user")?.content.slice(0,25)||"Chat";
  button.onclick=()=>{
   messages=chat.slice();
   area.innerHTML="";
   messages.forEach(m=>addMessage(m.content,m.role==="user"?"user":"ai"));
  };
  box.appendChild(button);
 });
}

function saveHistory(){
 if(!messages.length)return;
 history.unshift(messages.slice());
 history=history.slice(0,15);
 try{localStorage.setItem("slidemind_history",JSON.stringify(history));}catch(e){}
 renderHistory();
}

try{
 history=JSON.parse(localStorage.getItem("slidemind_history")||"[]");
 renderHistory();
}catch(e){}

async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;

 if(API_URL.startsWith("YOUR_PUBLIC")){
  addMessage(text,"user");
  messages.push({role:"user",content:text});
  input.value="";
  addMessage("SlideMind is ready! Its AI backend still needs to be connected. GitHub Pages hosts this website, but cannot run the Node.js server.","ai");
  status.textContent="Backend not connected";
  return;
 }

 addMessage(text,"user");
 messages.push({role:"user",content:text});
 input.value="";
 status.textContent="SlideMind is thinking...";

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"AI request failed");
  const reply=data.reply||"No response.";
  messages.push({role:"assistant",content:reply});
  addMessage(reply,"ai");
  saveHistory();
  status.textContent="Ready";
 }catch(error){
  addMessage("Connection error: "+error.message,"ai");
  status.textContent="Connection failed";
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>
</body>
</html>
